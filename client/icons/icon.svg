<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Startup Sim: a mug of office coffee in front of the city at sunset,
       in the game's shady storybook colours. -->
  <!-- street #17291f -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10232a"/>
      <stop offset="0.5" stop-color="#3a5a62"/>
      <stop offset="1" stop-color="#e6a27a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe2a8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffe2a8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="190"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="64" y="64" width="896" height="896" fill="url(#sky)"/>
    <!-- stars -->
    <g fill="#f6ecd4" opacity="0.7">
      <circle cx="210" cy="190" r="6"/><circle cx="330" cy="140" r="4"/><circle cx="780" cy="160" r="6"/>
      <circle cx="640" cy="120" r="4"/><circle cx="170" cy="320" r="4"/>
    </g>
    <!-- the setting sun and its glow -->
    <circle cx="770" cy="470" r="230" fill="url(#glow)"/>
    <circle cx="770" cy="470" r="70" fill="#ffe9bf"/>
    <!-- skyline -->
    <g fill="#1d3138" stroke="#0e1c22" stroke-width="6">
      <path d="M40 980 V640 H170 V980 Z"/>
      <path d="M160 980 V540 H290 V980 Z"/>
      <path d="M280 980 V690 H360 V980 Z"/>
      <path d="M660 980 V600 H760 V980 Z"/>
      <path d="M750 980 V500 H880 V980 Z"/>
      <path d="M870 980 V660 H990 V980 Z"/>
    </g>
    <g fill="#f2c46a">
      <rect x="190" y="580" width="26" height="34"/><rect x="240" y="580" width="26" height="34"/>
      <rect x="190" y="650" width="26" height="34"/><rect x="240" y="720" width="26" height="34"/>
      <rect x="70" y="690" width="26" height="34"/><rect x="120" y="760" width="26" height="34"/>
      <rect x="780" y="540" width="26" height="34"/><rect x="830" y="610" width="26" height="34"/>
      <rect x="780" y="680" width="26" height="34"/><rect x="690" y="640" width="26" height="34"/>
      <rect x="900" y="700" width="26" height="34"/>
    </g>
    <!-- the ground -->
    <rect x="64" y="880" width="896" height="100" fill="#17291f"/>
    <!-- trees in front, the sunset on their rims -->
    <g fill="#8a6a4a">
      <circle cx="104" cy="836" r="92"/><circle cx="196" cy="896" r="80"/>
      <circle cx="902" cy="826" r="96"/><circle cx="818" cy="902" r="78"/>
    </g>
    <g fill="#1d3a26">
      <circle cx="110" cy="842" r="90"/><circle cx="202" cy="902" r="78"/>
      <circle cx="908" cy="832" r="94"/><circle cx="824" cy="908" r="76"/>
    </g>
  </g>
  <!-- steam -->
  <g fill="none" stroke="#f6ecd4" stroke-width="26" stroke-linecap="round" opacity="0.9">
    <path d="M430 400 C390 350 470 310 430 250"/>
    <path d="M530 390 C490 330 580 290 530 210"/>
    <path d="M630 400 C590 350 670 310 630 250"/>
  </g>
  <!-- mug: a warm brown outline, a cream body, a terracotta band -->
  <g stroke="#3a2a22" stroke-width="22" stroke-linejoin="round">
    <path d="M718 540 C860 540 860 750 700 740" fill="none" stroke-width="54"/>
    <path d="M718 540 C860 540 860 750 700 740" fill="none" stroke="#f6ecd4" stroke-width="18"/>
    <path d="M318 450 H742 L712 820 C708 858 680 880 640 880 H420 C380 880 352 858 348 820 Z" fill="#f6ecd4"/>
  </g>
  <path d="M332 610 H728 L720 700 H340 Z" fill="#c0573c"/>
  <path d="M332 610 H728 M340 700 H720" stroke="#3a2a22" stroke-width="12" fill="none"/>
  <!-- coffee surface -->
  <ellipse cx="530" cy="462" rx="200" ry="26" fill="#5a3522" stroke="#3a2a22" stroke-width="12"/>
  <!-- highlight -->
  <path d="M390 500 L380 800" stroke="#fffaf0" stroke-width="18" stroke-linecap="round" opacity="0.6"/>
  <!-- tile rim -->
  <rect x="64" y="64" width="896" height="896" rx="190" fill="none" stroke="#1e2e33" stroke-width="28"/>
</svg>
