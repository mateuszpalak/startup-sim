# The Windows client (the 3D one, client3d/): on a Windows runner, export the build with Godot
# (tools/build-windows.sh), run the client's unit tests there too and keep
# the zips as an artifact. On a release tag (v*) the zips are attached to
# that GitHub release (created if it doesn't exist yet).
name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**.md", "server/**"]
  pull_request:
    paths: ["client3d/**", "tools/build-windows.sh", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Klient Windows (eksport + testy)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Cache Godota i szablonów
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/AppData/Roaming/Godot/export_templates
          key: godot-windows-${{ env.GODOT_VERSION }}-v2
      - name: Pobierz Godota i szablony eksportu
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSfL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_win64.exe.zip"
          unzip -q godot.zip -d ~/godot && rm godot.zip
          curl -sSfL -o tpl.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q tpl.tpz -d tpl && rm tpl.tpz
          dest=~/AppData/Roaming/Godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          mv tpl/templates/windows_* tpl/templates/version.txt "$dest/"
          rm -rf tpl
      # The console wrapper finds the real exe by its own file name, so both
      # keep the names they ship with.
      - name: Ścieżka do Godota
        run: echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_win64_console.exe" >> "$GITHUB_ENV"
      - name: Import projektu
        run: |
          "$GODOT" --headless --path client3d --import || true
      - name: Testy klienta (na Windows)
        run: |
          "$GODOT" --headless --path client3d -s tests/run_tests.gd 2>&1 | tee godot-tests.log
          grep -q ", 0 failures" godot-tests.log
      - name: Eksport (x86_64 + arm64)
        run: tools/build-windows.sh --all
      - name: Sprawdź exe
        run: |
          for z in dist/*.zip; do
            unzip -l "$z" | grep -q "StartupSim.exe" || { echo "brak exe w $z"; exit 1; }
          done
      - uses: actions/upload-artifact@v5
        with:
          name: startupsim-windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Dołącz do wydania
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: startupsim-windows
          path: dist
      - name: Wyślij zipy do wydania
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Startup Sim ${TAG#v}" --notes "" --draft
          gh release upload "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
